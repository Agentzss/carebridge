{% extends "base.html" %}
{% block title %}CareBridge Hospital{% endblock %}
{% block content %}

<div style="text-align: center; padding: 80px 20px;">
    <div style="font-size: 5rem; margin-bottom: 20px;">🏥</div>
    <h1 style="font-size: 2.2rem; color: var(--primary-dark); margin-bottom: 12px;">CareBridge Hospital</h1>
    <p style="color: var(--text-light); font-size: 1.05rem; margin-bottom: 40px;">
        Hospital Management System
    </p>
    <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
        <a href="/register" style="text-decoration: none;">
            <div style="background: white; padding: 24px 32px; border-radius: 14px; box-shadow: var(--shadow); text-align: center; min-width: 160px; transition: transform 0.2s; border-top: 4px solid var(--primary);">
                <div style="font-size: 2rem; margin-bottom: 8px;">👤</div>
                <div style="font-weight: 700; color: var(--primary-dark);">Register</div>
            </div>
        </a>
        <a href="/appointment" style="text-decoration: none;">
            <div style="background: white; padding: 24px 32px; border-radius: 14px; box-shadow: var(--shadow); text-align: center; min-width: 160px; transition: transform 0.2s; border-top: 4px solid var(--secondary);">
                <div style="font-size: 2rem; margin-bottom: 8px;">📅</div>
                <div style="font-weight: 700; color: var(--primary-dark);">Appointment</div>
            </div>
        </a>
        <a href="/bill" style="text-decoration: none;">
            <div style="background: white; padding: 24px 32px; border-radius: 14px; box-shadow: var(--shadow); text-align: center; min-width: 160px; transition: transform 0.2s; border-top: 4px solid var(--warning);">
                <div style="font-size: 2rem; margin-bottom: 8px;">💰</div>
                <div style="font-weight: 700; color: var(--primary-dark);">Bill</div>
            </div>
        </a>
        <a href="/triage" style="text-decoration: none;">
            <div style="background: white; padding: 24px 32px; border-radius: 14px; box-shadow: var(--shadow); text-align: center; min-width: 160px; transition: transform 0.2s; border-top: 4px solid var(--danger);">
                <div style="font-size: 2rem; margin-bottom: 8px;">🚑</div>
                <div style="font-weight: 700; color: var(--primary-dark);">Triage</div>
            </div>
        </a>
    </div>
</div>

{% endblock %}
