{% extends "base.html" %}
{% block title %}Register Patient - CareBridge{% endblock %}
{% block content %}

<div class="card" style="max-width: 560px; margin: 0 auto;">
    <div class="card-header">
        <span class="icon">👤</span>
        <h2>Register New Patient</h2>
    </div>

    <form method="POST" action="/register">
        <div class="form-group">
            <label>Full Name <span class="required">*</span></label>
            <input type="text" name="name" value="{{ name or '' }}" placeholder="e.g. John Smith" required>
        </div>

        <div class="form-group">
            <label>Age <span class="required">*</span></label>
            <input type="number" name="age" value="{{ age or '' }}" placeholder="e.g. 25" min="1" required>
            <div class="hint">Must be a positive whole number.</div>
        </div>

        <div class="form-group">
            <label>Patient ID <span class="required">*</span></label>
            <input type="text" name="patient_id" value="{{ pid or '' }}" placeholder="e.g. P-1001" required>
            <div class="hint">Unique identifier for the patient.</div>
        </div>

        <button type="submit" class="btn">Register Patient</button>
    </form>
</div>

{% endblock %}
