{% extends "base.html" %}
{% block title %}Book Appointment - CareBridge{% endblock %}
{% block content %}

<div class="card" style="max-width: 560px; margin: 0 auto;">
    <div class="card-header">
        <span class="icon">📅</span>
        <h2>Book Appointment</h2>
    </div>

    <form method="POST" action="/appointment">
        <div class="form-group">
            <label>Department <span class="required">*</span></label>
            <select name="department" required>
                <option value="" disabled {% if not dept %}selected{% endif %}>-- Select Department --</option>
                <option value="GP" {% if dept == 'GP' %}selected{% endif %}>GP (General Practitioner)</option>
                <option value="SPECIALIST" {% if dept == 'SPECIALIST' %}selected{% endif %}>Specialist</option>
            </select>
        </div>

        <div class="form-group">
            <label>Preferred Date <span class="required">*</span></label>
            <input type="date" name="appt_date" value="{{ date_str or '' }}" min="{{ min_date }}" required>
            <div class="hint">Appointment must be at least 7 days from today (after {{ min_date }}).</div>
        </div>

        <button type="submit" class="btn">Confirm Booking</button>
    </form>
</div>

{% endblock %}
